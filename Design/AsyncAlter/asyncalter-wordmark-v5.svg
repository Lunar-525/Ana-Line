    <filter id="glow-wide" x="-15%" y="-60%" width="130%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.6" />
    </filter>
    <filter id="glow-tight" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="512" height="1.6">
      <rect width="512" height="1.6" fill="white" />
      <rect y="1.05" width="512" height="0.55" fill="#a6a6a6" />
