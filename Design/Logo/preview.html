n\"><path transform=\"translate(258 0)\" fill=\"#8ddcdb\" d=\"M0 37H10V25H20V49H30V32H40V37H49V45H34V57H24V33H18V45H0Z\"/></g></g></svg>", "tv": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 605 132\" role=\"img\" aria-label=\"Ana-Line · tv · ligature wordmark\"><title>Ana-Line — 粗笔画连字</title><g fill=\"currentColor\" transform=\"translate(27 24) skewX(-13)\"><g class=\"letter-motion\"><path transform=\"translate(25 0)\" fill-rule=\"evenodd\" d=\"M0 80 23 0H47L65 62H99V80H50L46 62H23L19 80ZM27 46Q35 48 42 46L39 30Q35 21 31 30Z\"/><path transform=\"translate(104 0)\" fill-rule=\"evenodd\" d=\"M0 34V0H20L40 34H19L18 32V34ZM48 0H66V34H48ZM3 42H21V80H3ZM27 42H47L51 48V42H69V80H49Z\"/></g><g class=\"letter-motion\"><path transform=\"translate(179 0)\" fill-rule=\"evenodd\" d=\"M0 80 23 0H47L70 80H50L46 62H23L19 80ZM27 46Q35 48 42 46L39 30Q35 21 31 30Z\"/></g><g class=\"letter-motion\"><path transform=\"translate(323 0)\" fill-rule=\"evenodd\" d=\"M0 0H20V62H91V80H0Z\"/><path transform=\"translate(394 0)\" fill-rule=\"evenodd\" d=\"M0 0H20V80H0Z\"/></g><g class=\"letter-motion\"><path transform=\"translate(423 0)\" fill-rule=\"evenodd\" d=\"M0 34V0H20L40 34H19L18 32V34ZM48 0H66V34H48ZM3 42H21V80H3ZM27 42H47L51 48V42H69V80H49Z\"/></g><g class=\"letter-motion\"><path transform=\"translate(498 0)\" fill-rule=\"evenodd\" d=\"M0 0H52Q60 0 60 8V17H20V31H64V48H20V63H60V72Q60 80 52 80H0Z\"/></g><g class=\"connections\"/><g class=\"signal-motion\"><path transform=\"translate(258 0)\" fill=\"#ead477\" fill-rule=\"evenodd\" d=\"M0 37H7V16H14V37H23V22H30V37H39V28H46V37H49V44H46V53H39V44H30V59H23V44H14V65H7V44H0Z\"/></g></g></svg>"};
const config={"master": ["#d5ed79", "ANALOG IMAGE INSTRUMENTS", "AL / SYSTEM", "只保留 A—N、L—I 两处连笔，直接延展字母的主笔画。18 单位粗度与字干一致；其余字距留白，中间短横恢复简单形态。"], "film": ["#efaa71", "FILM DAMAGE / EXPOSURE", "AL / FILM", "L 的竖笔嵌入两个胶片片孔，底部像胶片卷带一样弯入 I，形成原有的粗连笔。保留 A 的圆肩与 E 的柔和内角，让胶片特征直接进入字母。"], "sstv": ["#8ddcdb", "SLOW SCAN TELEVISION", "AL / TX—RX", "两个 N 的斜笔加入短促的阶梯转折，E 的中横切出斜角；保留粗笔画的整体重量，呈现扫描信号的节奏。"], "tv": ["#ead477", "TERRESTRIAL ANALOG TELEVISION", "AL / AIR", "两个 N 像电视画面失去行同步一样横向断开，下半部分向右偏移；E 的中横向右探出，呼应错行与重影。保留 A 的 CRT 弧面内孔，以及中间的八木天线。"]};let activeMode='master';
let running=[];
function animateLogo(mode){
  running.forEach(a=>a.cancel());running=[];
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const svg=document.querySelector('#logo svg');
  svg.querySelectorAll('.letter-motion').forEach((wrapper,i)=>{
    // Animate the unpositioned wrapper: preserve each glyph's SVG transform.
    running.push(wrapper.animate([
      {transform:'translate(-7px, 2px)',opacity:.55},
      {transform:'translate(0, 0)',opacity:1}
    ],{duration:mode==='film'?520:380,delay:i*25,easing:'cubic-bezier(.2,.75,.25,1)',fill:'backwards'}));
  });
  // Opacity leaves the signal's attachment points and scale intact.
  ['.connections','.signal-motion'].forEach((selector,i)=>{
    running.push(svg.querySelector(selector).animate(
      [{opacity:.15},{opacity:1}],
      {duration:400,delay:120+i*50,easing:'ease-out',fill:'backwards'}));
  });
}
function select(mode,animate=true){activeMode=mode;const c=config[mode];document.querySelector('main').style.setProperty('--tone',c[0]);document.getElementById('logo').innerHTML=marks[mode];document.getElementById('small').innerHTML=marks[mode];document.getElementById('mono').innerHTML=marks[mode].replaceAll(c[0],'currentColor');document.getElementById('mode-label').textContent=c[1];document.getElementById('code').textContent=c[2];document.getElementById('description').textContent=c[3];document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));if(animate)animateLogo(mode)}document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));document.getElementById('replay').addEventListener('click',()=>select(activeMode));select('master',false);</script></html>
